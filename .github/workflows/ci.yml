name: CI

on:
  pull_request:
    branches: [implemenation/baseline, development, main]
  push:
    branches: [implemenation/baseline, development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'   # Angular 22 needs Node 22.22.3 or newer; '22' always gets the latest 22.x

defaults:
  run:
    working-directory: views

jobs:
  backend:
    name: Back end - unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Back-end unit tests (Jest)
        run: npm test
  frontend:
    name: Front end - lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: views/package-lock.json
      - run: npm ci
      - name: Static analysis (ESLint)
        run: npm run lint
      - name: Unit tests (Vitest)
        run: npx ng test --watch=false
      - name: Production build
        run: npx ng build

  e2e:
    name: Front end - E2E tests
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: views/package-lock.json
      - run: npm ci
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests (Playwright starts ng serve)
        run: npm run e2e
      - name: Keep the E2E report as CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: views/playwright-report/
          retention-days: 30

  e2e-live:
    name: E2E tests against the real API
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            views/package-lock.json
      - name: Install back-end dependencies
        working-directory: .
        run: npm ci
      - name: Install front-end dependencies
        run: npm ci
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests (Playwright starts the test API with an in-memory MongoDB, and ng serve -c e2e)
        run: npm run e2e:live
      - name: Keep the live E2E report as CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-live
          path: views/playwright-report-live/
          retention-days: 30

  audit:
    name: Front end - dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Fail on high or critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high